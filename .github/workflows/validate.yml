name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No connector servers shipped
        run: |
          if find plugins -name .mcp.json | grep -q .; then
            echo "::error::.mcp.json found, connectors must be stripped"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate marketplace and plugins
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
